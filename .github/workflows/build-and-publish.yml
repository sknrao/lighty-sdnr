# GitHub Actions workflow for building Lighty SDNR and publishing Docker image
# This builds the lightweight SDNR application with O-RAN NETCONF support
#
# The project is SELF-CONTAINED - no external netconf repo needed.
# O-RAN support modules (oran-netconf-model, netconf-transformer-patch) compile
# against Lighty's bundled dependencies (netconf 10.0.2 from ODL Vanadium).

name: Build and Publish Lighty SDNR (O-RAN)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx4g'
  REGISTRY: ghcr.io
  IMAGE_NAME: sknrao/lighty-sdnr

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings for ODL repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>odl</id>
                <repositories>
                  <repository>
                    <id>opendaylight-snapshots</id>
                    <url>https://nexus.opendaylight.org/content/repositories/opendaylight.snapshot/</url>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>opendaylight-releases</id>
                    <url>https://nexus.opendaylight.org/content/repositories/public/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>odl</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build Lighty SDNR (self-contained, includes O-RAN modules)
        run: |
          echo "Building Lighty SDNR with O-RAN NETCONF support..."
          echo "No external netconf repo needed - everything is self-contained!"
          mvn clean install -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighty-sdnr-app
          path: applications/lighty-sdnr-lite/lighty-sdnr-lite-app/target/*.jar
          retention-days: 30

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings for ODL repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>odl</id>
                <repositories>
                  <repository>
                    <id>opendaylight-snapshots</id>
                    <url>https://nexus.opendaylight.org/content/repositories/opendaylight.snapshot/</url>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>opendaylight-releases</id>
                    <url>https://nexus.opendaylight.org/content/repositories/public/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>odl</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build application and Docker image
        run: |
          # Build everything
          mvn clean install -DskipTests
          
          # Build Docker image
          cd applications/lighty-sdnr-lite/lighty-sdnr-lite-docker
          mvn package docker:build -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          # Get the local image name (from pom.xml)
          LOCAL_IMAGE="iosmcn-sdnrlite:latest"
          
          # Determine tags based on ref
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          elif [[ "${{ github.ref }}" == refs/heads/main ]] || [[ "${{ github.ref }}" == refs/heads/master ]]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          else
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${BRANCH_NAME}"
          fi
          
          # Tag and push each tag
          for TAG in $TAGS; do
            echo "Pushing: $TAG"
            docker tag $LOCAL_IMAGE $TAG
            docker push $TAG
          done

      - name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### O-RAN NETCONF Support" >> $GITHUB_STEP_SUMMARY
          echo "- IETF NETCONF 2013-09-29 revision (with NACM)" >> $GITHUB_STEP_SUMMARY
          echo "- NetconfMessageTransformer fix for base RPC parsing" >> $GITHUB_STEP_SUMMARY
          echo "- Self-contained (no external netconf repo)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pull:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
